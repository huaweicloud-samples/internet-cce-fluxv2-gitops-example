# Flux v2 GitOps 引导清单（等价于原 CDK fluxv2.ts 中的 GitRepoSelf + KustomizationSelf）。
# 由 install-flux.sh 在集群就绪后 apply。
#
# 说明：
#  - url 指向存放 k8s-config/ 的 Git 仓库（SSH 方式，与原仓保持一致，便于切换代码托管平台）。
#  - secretRef.name 对应 flux-system 命名空间下、包含 SSH 私钥的 Secret（见部署指导书）。
#  - path 指向集群级入口目录，与 k8s-config/clusters/demo/kustomization.yaml 对应。
---
apiVersion: source.toolkit.fluxcd.io/v1beta1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  ref:
    branch: main
  secretRef:
    name: github-keypair
  url: ssh://git@github.com/<your-org>/<your-repo>.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s-config/clusters/demo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  validation: client
