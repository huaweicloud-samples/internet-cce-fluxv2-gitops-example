---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: podinfo
  namespace: podinfo
spec:
  interval: 10m
  chart:
    spec:
      chart: podinfo
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: podinfo
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: "16m"
        memory: "24Mi"
      limits:
        cpu: "16m"
        memory: "24Mi"
    # 入口适配（原 AWS ALB ingress → 华为云 CCE ELB / nginx ingress）
    # CCE 提供托管的 nginx-ingress 插件（自动置备公网 ELB），ingress class 为 nginx。
    ingress:
      enabled: true
      className: nginx
      annotations:
        kubernetes.io/ingress.class: nginx
